name: Legami Watch

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub kann Laeufe um einige Minuten verzoegern
  workflow_dispatch:         # manueller Start ueber den Actions-Tab

concurrency:
  group: legami-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # Letzten Status wiederherstellen, damit nur Aenderungen gemeldet werden
      - uses: actions/cache@v4
        with:
          path: .legami_state.json
          key: legami-state-${{ github.run_id }}
          restore-keys: legami-state-

      - name: Seite pruefen
        run: python legami_watch.py --debug
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
